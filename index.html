<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nguyen The Anh | Engineering Portfolio</title>
    <script>
      // Redirect path-based URLs to hash-based URLs for HashRouter compatibility
      (function() {
        var path = window.location.pathname;
        var isFile = /\.[a-zA-Z0-9]+$/.test(path) || path.indexOf('/assets/') !== -1;
        if (path !== '/' && path !== '/TheAnhPortfolio' && path !== '/TheAnhPortfolio/' && !isFile) {
          var base = '/';
          if (path.indexOf('/TheAnhPortfolio') === 0) {
            base = '/TheAnhPortfolio/';
          }
          var routePath = path.substring(base.length).replace(/^\/+/, '');
          window.location.replace(base + '#/' + routePath + window.location.search + window.location.hash);
        }
      })();
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-surface text-on-surface font-body-md selection:bg-primary-fixed-dim selection:text-on-primary-fixed">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
